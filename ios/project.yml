# XcodeGen project specification for PhinCall iOS (Avaya WebRTC Connect SDK 4.0.10)
# Run `xcodegen generate` on macOS after placing the four Avaya XCFrameworks in ios/Frameworks/.
name: PhinCalliOS
options:
  bundleIdPrefix: com.phincall
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Avaya WebRTC Connect SDK does not support Bitcode (Guide 4.0.10, p. 45).
    ENABLE_BITCODE: NO
    # 64-bit architectures only per Apple and Avaya CSDK requirements (Guide 4.0.10, pp. 44-45).
    ARCHS: "$(ARCHS_STANDARD)"
    VALID_ARCHS: "arm64 arm64e x86_64"

targets:
  PhinCalliOS:
    type: application
    platform: iOS
    sources:
      - path: PhinCalliOS
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phincall.webrtc.ios
        SWIFT_OBJC_BRIDGING_HEADER: PhinCalliOS/Bridging/PhinCalliOS-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      # Static XCFramework: MUST be Do Not Embed (embed: false) or Xcode rejects embedding a static library.
      - framework: Frameworks/OceanaCustomerWebVoiceVideo.xcframework
        embed: false
      # Dynamic Avaya Client SDK XCFrameworks: MUST be Embed & Sign (embed: true, codeSign: true).
      - framework: Frameworks/AvayaClientServicesLite.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/AvayaClientMedia.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/RVVideoCodec.xcframework
        embed: true
        codeSign: true
      # System frameworks (Guide 4.0.10, pp. 46, 70)
      - sdk: Foundation.framework
      - sdk: MessageUI.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
